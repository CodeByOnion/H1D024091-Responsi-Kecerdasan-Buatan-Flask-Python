<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H1D024091 - Sistem Pakar Integritas Asprak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-dark text-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="card border-0 shadow-lg bg-secondary text-white mb-4" style="border-radius: 15px;">
                    <div class="card-body p-4">
                        <h4 class="card-title text-center text-warning fw-bold mb-4">Sipaling Pakar</h4>
                        <p class="text-center text-light-50 small mb-4">Sistem Pakar Validasi Asisten
                            Praktikum: Klasifikasi 'Malaikat' vs 'Demon'.</p>

                        <form action="/pakar" method="POST">

                            <div class="mb-3">
                                <label class="form-label">Siapa nama asprak anda:</label>
                                <input type="text" name="nama_asprak" class="form-control bg-dark text-white border-0"
                                    placeholder="Ketik nama asprak di sini..." required autocomplete="off">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Tenggat Waktu Tugas (Deadline):</label>
                                <select name="deadline" class="form-select bg-dark text-white border-0" required>
                                    <option value="" selected disabled hidden>-- Pilih Kondisi Tugas --</option>
                                    <option value="evil">Kurang dari 24 Jam</option>
                                    <option value="mid">3 Hari</option>
                                    <option value="angel">1 Minggu Santai</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold shadow-sm text-dark mb-3">
                                JALANKAN VALIDASI
                            </button>

                            <div class="text-center">
                                <a href="/" class="btn btn-outline-light btn-sm px-4">Kembali</a>
                            </div>
                        </form>
                    </div>
                </div>

                {% if hasil_pakar is defined %}
                <div class="card bg-white text-dark shadow-lg animate__animated animate__tada"
                    style="border-radius: 15px;">
                    <div class="card-body p-4 text-center">
                        <h5 class="text-muted text-uppercase small fw-bold mb-3">Diagnosis Sistem Pakar</h5>

                        <h3 class="text-warning fw-bold">{{ hasil_pakar }}</h3>
                        <hr>
                        <p class="lead mb-4" style="font-style: italic;">"{{ pesan_pakar }}"</p>

                        <a href="/pakar" class="btn btn-outline-secondary btn-sm px-4">Reset Uji Coba</a>
                    </div>
                </div>
                {% endif %}

            </div>
        </div>

        <footer class="mt-5 text-center text-white-50 small">
            <p>&copy; H1D024091 - Sistem Pakar Paling Valid</p>
        </footer>
    </div>
</body>

</html>
